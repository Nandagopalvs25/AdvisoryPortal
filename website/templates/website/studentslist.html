{% extends "website/index.html" %}
{% load i18n %}
{% block content %}

<body>
    <div class="container pt-4">
        <!-- Page Title -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Student List</h1>
            <form class="form-inline d-flex align-items-center">
                <input class="form-control me-2" type="search" placeholder="Search students..." aria-label="Search">
                <button class="btn btn-success" type="submit">Search</button>
            </form>
        </div>

        <!-- Batch Selection -->
        <div class="row mb-4">
            <div class="col-md-3">
                <label for="batchSelect" class="form-label fw-bold">Select Batch</label>
                <select class="form-select" id="batchSelect" aria-label="Select batch">
                    <option selected>Choose batch...</option>
                    <option value="1">Batch One</option>
                    <option value="2">Batch Two</option>
                    <option value="3">Batch Three</option>
                </select>
            </div>
        </div>

        <!-- Students Table -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" style="width: 5%;">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Admission No.</th>
                        <th scope="col">Roll No.</th>
                        <th scope="col">Batch</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in students %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ s.user.username }}</td>
                        <td>{{ s.admission_number }}</td>
                        <td>{{ s.roll_number }}</td>
                        <td>{{ s.batch }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

{% endblock %}
